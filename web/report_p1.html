detail=`<div class="panel" style="margin-top:14px"><div class="section-head"><div><h2 style="font-size:18px">${esc(r.era)}一朝 · ${esc(r.name)}（${esc(r.temple)}）</h2><p>${r.start}-${r.end} · 在位 ${r.end-r.start+1} 年 · ${esc(r.note)}</p></div><span class="muted">再次点击同一卡片可收起</span></div><div class="dynasty-detail-grid"><div><h3 style="margin:0 0 8px;font-size:14px">本朝大事（${evs.length}）</h3>${evs.slice(0,14).map(e=>`<div class="dynasty-event-row"><span><span class="cat-dot" style="--cat:${eventCatColor(e.category)}"></span><button class="link-button" data-event-id="${e.id}">${esc(e.name)}</button></span><span class="muted">${esc(e.year||'')} · ${esc((e.participants||[]).slice(0,3).join('、'))}</span></div>`).join('')||'<div class="empty">本朝暂无可纪年大事</div>'}</div><div><h3 style="margin:0 0 8px;font-size:14px">本朝活跃人物</h3><div class="source-row">${topP.map(([p,c])=>`<span class="source-chip">${esc(p)} · ${c} 件</span>`).join('')||'<span class="muted">暂无</span>'}</div></div></div></div>`}}
$('#dynasty').innerHTML=`<div class="section-head"><div><h2>帝王谱系</h2><p>十六位天子、十七段年号；${DATA.timeline.length} 件可纪年大事按在位期自动归位，条带宽度即在位时长。</p></div><span class="status">帝系为人工整理 · 事件自动对位</span></div><div class="panel" style="margin-bottom:14px"><div class="section-head"><div><h2 style="font-size:16px">一、在位条带与逐年大事热度</h2><p>上条为年号区间（1368-1644），下条为逐年事件数，颜色随年号切换；悬停看具体年份。</p></div></div><div class="dynasty-band">${segs}</div><div class="dynasty-hist">${bars}</div><div class="dynasty-scale"><span>1368 · 洪武开国</span><span>1644 · 崇祯殉国</span></div></div><div class="panel"><div class="section-head"><div><h2 style="font-size:16px">二、十六帝小传</h2><p>点击任一帝王卡片或上方年号条，展开本朝大事与活跃人物。</p></div></div><div class="dynasty-cards">${cards}</div></div>${detail}`;
document.querySelectorAll('#dynasty .dynasty-card,#dynasty .dynasty-seg').forEach(el=>el.addEventListener('click',()=>{state.dynastyEra=state.dynastyEra===el.dataset.era?'':el.dataset.era;renderDynasty()}));
document.querySelectorAll('#dynasty [data-event-id]').forEach(b=>b.addEventListener('click',()=>showEvent(DATA.events.find(x=>x.id===b.dataset.eventId))))}
function renderChronicle(){const lives=(DATA.lifespans||[]).slice();if(!lives.length){$('#chronicle').innerHTML='<div class="empty">暂无年谱数据</div>';return}const GROUP_COLORS={'帝系':'#8d3025','开国功臣':'#b88b35','永乐群英':'#476b86','内阁文臣':'#527b5c','武将勋臣':'#8c6344','宦官佞幸':'#706b91','对手与民变':'#a24b55','文苑行者':'#6f6a63'};const minY=Math.min(...lives.map(x=>x.birth))-3,maxY=Math.max(...lives.map(x=>x.death))+3,span=maxY-minY;const pct=y=>(y-minY)*100/span;const reigns=DATA.reigns||[];let bands='';if(1368>minY)bands+=`<span class="chronicle-band" style="left:0;width:${pct(Math.min(1368,maxY))}%;background:#9d9a8d" title="明兴之前"></span>`;reigns.forEach(r=>{bands+=`<span class="chronicle-band" style="left:${pct(r.start)}%;width:${(r.end-r.start+1)*100/span}%;background:${reignColor(r.order-1)}" title="${esc(r.era)} ${r.start}-${r.end}"></span>`});if(maxY>1644)bands+=`<span class="chronicle-band" style="left:${pct(1645)}%;width:${pct(maxY)-pct(1645)}%;background:#9d9a8d" title="甲申之后"></span>`;let ticks='';for(let y=Math.ceil(minY/25)*25;y<=maxY;y+=25){ticks+=`<span class="chronicle-tick" style="left:${pct(y)}%">${y}</span>`}const groups=[];lives.slice().sort((a,b)=>a.birth-b.birth).forEach(l=>{let g=groups.find(x=>x.label===l.group);if(!g){g={label:l.group,items:[]};groups.push(g)}g.items.push(l)});const charSet=new Set(DATA.characters.map(c=>c.name));const rows=groups.map(g=>{const c=GROUP_COLORS[g.label]||'#9d9a8d';return `<div class="chronicle-group"><span class="cat-dot" style="--cat:${c}"></span>${esc(g.label)} · ${g.items.length} 人</div>`+g.items.map(l=>{const left=pct(l.birth),w=Math.max(.7,pct(l.death+1)-left);const btn=charSet.has(l.name)?`<button class="link-button" data-person="${esc(l.name)}">${esc(l.name)}</button>`:esc(l.name);return `<div class="chronicle-row"><div class="chronicle-name">${btn}</div><div class="chronicle-track"><span class="chronicle-bar" style="left:${left}%;width:${w}%;background:${c}" title="${esc(l.name)} · ${l.birth}–${l.death}${l.note?' · '+esc(l.note):''}"></span></div></div>`}).join('')}).join('');$('#chronicle').innerHTML=`<div class="section-head"><div><h2>年谱 · 人物生平对照</h2><p>${lives.length} 位主要人物的生卒年横向展开，底色条带为十六帝在位期，人物与年号直接对位；点击人名打开详情。</p></div><span class="status draft">生卒年据通行史料整理 · 需史料核验</span></div><div class="panel"><div class="chronicle-wrap">${bands}<div class="chronicle-content"><div class="chronicle-axis">${ticks}</div>${rows}</div></div></div>`;document.querySelectorAll('#chronicle [data-person]').forEach(b=>b.addEventListener('click',()=>{const x=DATA.characters.find(y=>y.name===b.dataset.person);if(!x)return;openDetail(x.name,`<div class="detail-grid"><div class="detail-block"><strong>身份</strong><p>${esc(x.role)}</p></div><div class="detail-block"><strong>势力</strong><p>${esc(x.faction||'未标注')}</p></div><div class="detail-block"><strong>生卒 / 籍贯</strong><p>${esc(x.life)} · ${esc(x.birth)}</p></div><div class="detail-block"><strong>状态</strong><p>${esc(x.status)}</p></div><div class="detail-block detail-wide"><strong>别名</strong><p>${esc(x.aliases.join('、')||'无')}</p></div><div class="detail-block detail-wide"><strong>涉及事件</strong><p>${esc(x.events.slice(0,8).join('、')||'无')}</p></div><div class="detail-block detail-wide"><strong>来源章节</strong><div class="source-row">${chapterChips(x.chapters.map(k=>({key:k,...DATA.chapters[k]})))}</div></div></div>`)}))}function renderTimeline(){const cats=DATA.eventCategories||[];const filtered=(state.timelineCategory==='全部类别')?DATA.timeline:DATA.timeline.filter(x=>x.category===state.timelineCategory);const page=slicePage(filtered,state.timelinePage);const groups=[];for(const event of page){const year=event.year||'年份待考';let group=groups.find(x=>x.year===year);if(!group){group={year,items:[]};groups.push(group)}group.items.push(event)}$('#timeline').innerHTML=`<div class="section-head"><div><h2>时间轴</h2><p>按数值年份排序；年份待考事件单独保留，不再混入历史顺序。</p></div></div><div class="panel"><div class="toolbar"><label>类别</label><select id="timelineCategory">${cats.map(c=>`<option ${state.timelineCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="muted">圆点颜色即事件类别</span></div><div class="timeline">${groups.map(g=>`<div class="year-group"><h3>${esc(g.year)}${eraTag(g.year)}</h3>${g.items.map(x=>`<div class="timeline-item"><span class="cat-dot" style="--cat:${eventCatColor(x.category)}" title="${esc(x.category)}"></span><button data-event-id="${x.id}">${esc(x.name)}</button><span class="muted"> · ${esc(x.participants.slice(0,4).join('、'))}</span></div>`).join('')}</div>`).join('')}</div>${pager(state.timelinePage,filtered.length)}</div><div class="panel unknown"><div class="section-head"><div><h2 style="font-size:18px">年份待考</h2><p>${DATA.unknownTimeline.length} 件事件仍在事件索引中。</p></div></div><div class="source-row">${DATA.unknownTimeline.slice(0,80).map(x=>`<button class="source-chip link-button" data-event-id="${x.id}">${esc(x.name)}</button>`).join('')}</div></div>`;$('#timelineCategory').addEventListener('change',e=>{state.timelineCategory=e.target.value;state.timelinePage=1;renderTimeline()});const root=$('#timeline');bindPaging(root,delta=>{state.timelinePage+=delta;renderTimeline()});root.querySelectorAll('[data-event-id]').forEach(b=>b.addEventListener('click',()=>showEvent(DATA.events.find(x=>x.id===b.dataset.eventId))))}
renderOverview();state.rendered.overview=true;
</script>
