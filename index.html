<html lang="zh-CN">
<head>

<meta name="color-scheme" content="light">
<title>明朝那些事儿 · 七部全书</title>

</head>
<body>
<a class="skip-link" href="#mainContent">跳到主要内容</a>
<header class="app-header"><div class="header-inner">
  <h1 class="brand">明朝那些事儿 · 七部全书</h1><div id="headerStat" class="header-stat"></div>
  <nav class="tabs" aria-label="报告视图">
    <div class="nav-cluster" role="group" aria-label="全局叙事"><span class="nav-cluster-label" aria-hidden="true">全局</span><button data-view="overview" class="active">总览</button><button data-view="distribution">分布</button><button data-view="timeline">时间轴</button><button data-view="dynasty">帝王</button><button data-view="chronicle">年谱</button></div>
    <div class="nav-cluster" role="group" aria-label="实体索引"><span class="nav-cluster-label" aria-hidden="true">实体</span><button data-view="characters">人物</button><button data-view="locations">地点</button><button data-view="events">事件</button><button data-view="relations">关系</button></div>
    <div class="nav-cluster" role="group" aria-label="探索分析"><span class="nav-cluster-label" aria-hidden="true">探索</span><button data-view="visuals">图谱</button><button data-view="map">地图</button><button data-view="insight">洞察</button></div>
  </nav>
</div></header>
<main class="shell" id="mainContent" tabindex="-1">
  <section id="overview" class="view active"></section>
  <section id="distribution" class="view"></section>
  <section id="visuals" class="view"></section>
  <section id="locations" class="view"></section>
  <section id="map" class="view"><div class="section-head"><div><h2>地图</h2><p>圣地巡礼地图聚焦书中已定位地点；郑和下西洋航线为独立子视图，仅绘制航线与停靠点。</p></div></div><div class="subnav" id="mapSubnav"><button class="active" data-map-mode="pilgrim">圣地巡礼地图</button><button data-map-mode="voyage">郑和下西洋航线</button></div><div class="panel map-wrap" id="pilgrimPanel"><div class="toolbar"><span class="muted grow" id="mapNote"></span></div><div class="map-layout"><div class="map-main"><div id="mapBox" class="map-box"></div></div><aside id="locDock" class="loc-dock" hidden></aside></div></div><div class="panel map-wrap" id="voyagePanel" style="display:none"><div class="toolbar"><span class="muted grow" id="voyageNote"></span></div><div class="map-layout"><div class="map-main"><div id="voyageBox" class="map-box"></div></div><aside id="voyageDock" class="loc-dock" hidden></aside></div></div></section>
  <section id="characters" class="view"></section>
  <section id="events" class="view"></section>
  <section id="relations" class="view"></section>
  <section id="timeline" class="view"></section>
  <section id="dynasty" class="view"></section>
  <section id="chronicle" class="view"></section>
  <section id="insight" class="view"></section>
</main>
<dialog id="detailDialog"><div class="dialog-body"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="dialog-close" id="dialogClose">关闭</button></div><div id="dialogContent"></div></div></dialog>
<footer class="muted app-footer">数据来自章节抽取与人工整理；地点、年份及关系均保留核验状态。</footer>
<script>
/* 启动守卫（P3-03）：主脚本内联了整份数据，一旦数据被裁剪或脚本执行抛错，
   页面会停在空白骨架且毫无提示。这里独立于主脚本先埋一个检查点：
   5 秒内若主脚本仍未置位 __MING_READY，就渲染一条可见的错误提示与重载入口。
   本段不依赖任何外部资源，也不受数据注入影响（注意：此处不得书写数据占位符
   本身，否则字典序注入会把整份 payload 塞进注释里，产物体积直接翻倍）。 */
window.__MING_BOOTERR='';
window.addEventListener('error',function(e){if(e&&e.message&&!window.__MING_BOOTERR)window.__MING_BOOTERR=e.message;});
setTimeout(function(){
  if(window.__MING_READY)return;
  var bar=document.createElement('div');
  bar.className='fail-bar fail-error';
  bar.setAttribute('role','alert');
  var msg=document.createElement('span');msg.className='fail-msg';
  msg.textContent='报告未能完成初始化'+(window.__MING_BOOTERR?'：'+String(window.__MING_BOOTERR).slice(0,160):'（内嵌数据可能缺失或被裁剪）')+'。可重新加载，或改用完整版文件打开。';
  var acts=document.createElement('span');acts.className='fail-acts';
  var btn=document.createElement('button');btn.type='button';btn.className='fail-act';btn.textContent='重新加载';
  btn.addEventListener('click',function(){location.reload();});
  acts.appendChild(btn);bar.appendChild(msg);bar.appendChild(acts);
  (document.body||document.documentElement).appendChild(bar);
},5000);
</script>
<script src="assets/boot-data.js"></script>
<script src="assets/data-loader.js"></script>
<script src="assets/app.js"></script>
<script src="assets/lazy-data.js"></script>
<script>
/* V2 首页探索路径：只增强已有总览 DOM，业务跳转继续复用 app.js 的 data-open-view 委托。 */
(function(){
  var overview=document.getElementById('overview');
  if(!overview)return;
  function enhanceOverview(){
    if(overview.querySelector('.v2-journeys')||!overview.querySelector('.summary-hero'))return;
    var section=document.createElement('section');
    section.className='v2-journeys';
    section.setAttribute('aria-labelledby','v2JourneyTitle');
    section.innerHTML='<div class="v2-journey-head"><div><h3 id="v2JourneyTitle">三条探索路径</h3><p>不必逐个理解所有视图，先从你关心的问题进入。</p></div><span class="muted">全局 → 实体 → 证据</span></div>'+
      '<div class="v2-journey-grid">'+
        '<article class="v2-journey-card"><span class="v2-journey-kicker">人物脉络</span><h4>谁推动了历史？</h4><p>先看人物卡，再沿关系网络查看君臣、党争、亲属与冲突。</p><div class="v2-journey-links"><button data-open-view="characters">人物</button><button data-open-view="relations">关系</button><button data-open-view="visuals">关系图谱</button></div></article>'+
        '<article class="v2-journey-card"><span class="v2-journey-kicker">时间脉络</span><h4>事情何时发生？</h4><p>把事件放回年代，再对照帝王在位区间与人物生平年谱。</p><div class="v2-journey-links"><button data-open-view="timeline">时间轴</button><button data-open-view="dynasty">帝王</button><button data-open-view="chronicle">年谱</button></div></article>'+
        '<article class="v2-journey-card"><span class="v2-journey-kicker">空间与结构</span><h4>历史在哪里交汇？</h4><p>从地点与地图进入，再用分布、图谱和洞察寻找跨章节结构。</p><div class="v2-journey-links"><button data-open-view="map">地图</button><button data-open-view="distribution">分布</button><button data-open-view="insight">洞察</button></div></article>'+
      '</div>';
    overview.querySelector('.summary-hero').insertAdjacentElement('afterend',section);
  }
  new MutationObserver(function(){requestAnimationFrame(enhanceOverview);}).observe(overview,{childList:true});
  enhanceOverview();
})();
</script>

<script src="assets/experience.js"></script>
