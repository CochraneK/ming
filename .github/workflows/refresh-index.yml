name: Refresh generated index

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/**"
      - "sw.js"
      - ".github/workflows/refresh-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-generated-index
  cancel-in-progress: false

jobs:
  refresh:
    # 自动生成提交也会触发 web/**；bot 提交直接跳过，避免生成镜像造成二次循环。
    if: github.actor != 'github-actions[bot]'
    name: 重建公开报告、主题镜像与 README 统计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 同步视觉主题镜像
        run: python src/sync_theme.py

      - name: 同步 README 最终模型口径
        run: python src/sync_readme.py

      - name: 构建 standalone 根产物
        run: python src/build.py --scope full --out index.html --quiet

      - name: 仅在公开产物变化时回写 main
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main 已有更新；放弃本次旧快照回写，由更新提交触发的新任务负责。"
            exit 0
          fi
          if git diff --quiet -- README.md web/template/index.html index.html; then
            echo "主题镜像 / README.md / index.html 已与源码一致，无需提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md web/template/index.html index.html
          git commit -m "chore: refresh generated report, theme mirror and README stats"
          git push origin HEAD:main
