name: Refresh generated index

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/**"
      - "sw.js"
      - ".github/workflows/refresh-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-generated-index
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: 重建在线 V10 空间分层版、离线版与 README 统计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 规范化前端动态统计口径
        run: python src/normalize_frontend.py

      - name: 同步实体详情分片搜索钩子
        run: python src/sync_lazy_data.py

      - name: 规范化基础 CSS
        run: python src/normalize_css.py

      - name: 同步视觉主题镜像
        run: python src/sync_theme.py

      - name: 同步 V3 / V10 产品体验镜像
        run: python src/sync_experience.py

      - name: 同步 README 最终模型口径
        run: python src/sync_readme.py

      - name: 构建 V10 双交付产物
        shell: bash
        run: |
          rm -rf .ci/publish
          python src/build.py --scope full --target web --out .ci/publish --quiet
          python src/build.py --scope full --target standalone --out standalone.html --quiet
          rm -rf assets
          cp .ci/publish/index.html index.html
          cp -R .ci/publish/assets assets
          cmp -s .ci/publish/sw.js sw.js
          python src/check_delivery.py .ci/publish
          python src/check_budget.py standalone.html

      - name: 仅在公开产物变化时回写 main
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main 已有更新；放弃本次旧快照回写，由更新提交触发的新任务负责。"
            exit 0
          fi
          if git diff --quiet -- web/js/app.js web/js/experience.js web/css/app.css web/template/index.html README.md index.html standalone.html assets; then
            echo "源码镜像、README、在线 V10 空间分层版与离线版均已一致，无需提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/js/app.js web/js/experience.js web/css/app.css web/template/index.html README.md index.html standalone.html assets
          git commit -m "chore: publish layered space web data"
          git push origin HEAD:main
