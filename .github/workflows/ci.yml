name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 语法 · 不变量 · 构建 · V12 浏览器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 版权合规巡检
        run: |
          bad=$(git ls-files | grep -Ei 'chapters\.json|明朝那些事儿' || true)
          if [ -n "$bad" ]; then
            echo "::error::仓库里出现了不该公开的原书全文文件（见下），请立即移除："
            echo "$bad"
            exit 1
          fi
          echo "未发现原书全文文件 ✓"

      - name: Python 语法检查
        run: python -m compileall -q src tests .dump/_web_browser_check.py

      - name: 前端动态统计口径规范化
        run: |
          python src/normalize_frontend.py
          python src/normalize_frontend.py --check

      - name: V12 事件摘要前端钩子同步
        run: |
          python src/sync_event_cards_v12.py
          python src/sync_event_cards_v12.py --check

      - name: 实体详情分片搜索钩子同步
        run: |
          python src/sync_lazy_data.py
          python src/sync_lazy_data.py --check

      - name: 前端脚本语法检查
        run: |
          node --check web/js/app.js
          node --check web/js/experience.js
          node --check web/js/data-loader.js
          node --check web/js/lazy-data.js

      - name: 基础 CSS 历史去重冒烟
        run: |
          python src/normalize_css.py
          python src/normalize_css.py --check

      - name: 主题 CSS 镜像同步冒烟
        run: |
          python src/sync_theme.py
          git diff --check -- web/template/index.html

      - name: V3 / V12 产品体验镜像同步冒烟
        run: |
          python src/sync_experience.py
          python src/sync_experience.py --check
          git diff --check -- web/template/index.html

      - name: 单元测试（共享核心 + 数据不变量 + 模板）
        run: python tests/run_tests.py

      - name: README 同步脚本冒烟
        run: |
          python src/sync_readme.py
          python src/sync_readme_v11.py
          python src/sync_readme_v12.py
          python src/sync_readme_v12.py --check
          git diff --check -- README.md

      - name: 构建冒烟（standalone，不落盘）
        run: python src/build.py --check

      - name: 数据审计
        run: python src/audit_final.py --quick

      - name: 最终 payload 与实体分片体积剖析
        run: python src/check_payload_budget.py --json .ci/payload-sizes.json

      - name: 构建离线单文件产物
        run: python src/build.py --scope full --target standalone --out .ci/standalone.html --quiet

      - name: 离线版体积预算
        run: python src/check_budget.py .ci/standalone.html

      - name: 构建在线 V12 分层产物
        run: |
          python src/build.py --scope full --target web --out .ci/site --quiet
          python src/split_time_asset_v11.py .ci/site
          python src/split_time_asset_v11.py .ci/site --check
          python src/split_event_asset_v12.py .ci/site
          python src/split_event_asset_v12.py .ci/site --check

      - name: 在线实体/空间基础结构与体积预算
        run: python src/check_delivery.py .ci/site

      - name: V11 时间域分层与年谱预算
        run: python src/check_time_layers_v11.py .ci/site

      - name: V12 事件摘要/详情分层与组合入口预算
        run: python src/check_event_layers_v12.py .ci/site

      - name: 单文件无头浏览器自检
        run: python .dump/_browser_check.py .ci/standalone.html

      - name: V3 单文件产品体验浏览器自检
        run: python .dump/_experience_browser_check.py .ci/standalone.html

      - name: V12 在线分层浏览器自检
        run: python .dump/_web_browser_check.py .ci/site/index.html
