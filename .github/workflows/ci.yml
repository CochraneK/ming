name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 语法 · 不变量 · 构建冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 版权合规：原书全文（明朝那些事儿.txt）与含正文的 data/chapters.json
      # 是本地私有文件，绝不能出现在仓库里。放最前面，失败即停。
      - name: 版权合规巡检
        run: |
          bad=$(git ls-files | grep -Ei 'chapters\.json|明朝那些事儿' || true)
          if [ -n "$bad" ]; then
            echo "::error::仓库里出现了不该公开的原书全文文件（见下），请立即移除："
            echo "$bad"
            exit 1
          fi
          echo "未发现原书全文文件 ✓"

      - name: Python 语法检查
        run: python -m compileall -q src tests

      - name: 前端脚本语法检查
        run: node --check web/js/app.js

      # 测试与构建都不依赖 data/chapters.json（不入库的版权文件）：
      # 章节标题来自 data/extract_raw.json，缺 chapters.json 只会少字数统计。
      - name: 单元测试（共享核心 + 数据不变量 + 模板）
        run: python tests/run_tests.py

      - name: README 同步脚本冒烟
        run: |
          python src/sync_readme.py
          git diff --check -- README.md

      - name: 构建冒烟（standalone，不落盘）
        run: python src/build.py --check

      - name: 数据审计
        run: python src/audit_final.py --quick

      # 真实产物 + 无头浏览器自检：deep link / 搜索高亮 / tab 语义
      # （runner 上 Chrome 路径不固定，脚本会自己探测 CHROME_BIN 与常见路径）
      - name: 构建单文件产物
        run: python src/build.py --scope full --out .ci/index.html --quiet

      - name: 无头浏览器自检
        run: python .dump/_browser_check.py .ci/index.html
